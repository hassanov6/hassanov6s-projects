<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Firebase Proxy</title>
</head>
<body>
<script type="module">
// Importer Firebase
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// Configuration Firebase
const firebaseConfig = {
  apiKey: "AIzaSyCSAyZZSqjun0C0fc4MZze4o3oy05oK6LY",
  authDomain: "cycling-tracker-projet.firebaseapp.com",
  databaseURL: "https://cycling-tracker-projet-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "cycling-tracker-projet",
  storageBucket: "cycling-tracker-projet.firebasestorage.app",
  messagingSenderId: "545589672511",
  appId: "1:545589672511:web:8307e64f37b32a4199168a",
  measurementId: "G-Q62FG5D7QK"
};

// Initialisation Firebase
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

// API pour récupérer les données Firebase
window.getFirebaseData = async function() {
    try {
        const user = await authenticateUser();
        const dataRef = ref(db, `users/${user.uid}/sessions`);

        const snapshot = await get(dataRef);

        if (snapshot.exists()) {
            const data = snapshot.val();

            // Créer le format compatible APK
            const completedSessions = [];

            if (data && data.completed_sessions) {
                for (const session of data.completed_sessions) {
                    const zoneTimes = {
                        z1: session.zone_times?.z1 || 0,
                        z2: session.zone_times?.z2 || 0,
                        z3: session.zone_times?.z3 || 0,
                        z4: session.zone_times?.z4 || 0,
                        z5: session.zone_times?.z5 || 0
                    };

                    completedSessions.push({
                        date: session.date,
                        session_type: session.session_type || "Endurance",
                        duration_minutes: session.duration_minutes || 0,
                        completed_at: session.completed_at || new Date().toISOString(),
                        zone_times: zoneTimes
                    });
                }
            }

            const exportData = {
                export_date: new Date().toISOString(),
                version: "1.0",
                completed_sessions: completedSessions,
                total_completed: completedSessions.length
            };

            console.log("✅ Données Firebase récupérées:", exportData.total_completed, "sessions");
            return exportData;
        } else {
            console.log("⚠️ Aucune donnée trouvée dans Firebase");
            return {
                export_date: new Date().toISOString(),
                version: "1.0",
                completed_sessions: [],
                total_completed: 0,
                message: "Aucune donnée disponible"
            };
        }
    } catch (error) {
        console.error("❌ Erreur lors de la récupération Firebase:", error);
        return {
            error: error.message,
            export_date: new Date().toISOString(),
            version: "1.0",
            completed_sessions: [],
            total_completed: 0
        };
    }
};

// Fonction d'authentification anonyme
function authenticateUser() {
    return new Promise((resolve, reject) => {
        onAuthStateChanged(auth, (user) => {
            if (user) {
                console.log("Utilisateur authentifié avec UID:", user.uid);
                resolve(user);
            } else {
                signInAnonymously(auth)
                    .then((userCredential) => {
                        console.log("Nouvel utilisateur anonyme créé:", userCredential.user.uid);
                        resolve(userCredential.user);
                    })
                    .catch((error) => {
                        console.error("Erreur d'authentification:", error);
                        reject(error);
                    });
            }
        });
    });
}

// Vérifier si l'APK demande les données
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.has('format') && urlParams.get('format') === 'json') {
    document.open();
    document.write('data:text/json;charset=utf-8,' + encodeURIComponent(JSON.stringify(await window.getFirebaseData(), null, 2)));
    document.close();
}
</script>
</body>
</html>
